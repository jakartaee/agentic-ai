name: Main build

on:
    push:
        branches:
            - main
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: 17

            - name: Cache Maven packages
              uses: actions/cache@v4
              with:
                  path: ~/.m2/repository
                  key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
                  restore-keys: ${{ runner.os }}-m2

            - name: Build
              run: mvn clean install -Pweld-embedded

            - name: License Check
              run: |
                  attempt=1
                  max_attempts=3
                  until mvn org.eclipse.dash:license-tool-plugin:license-check -Pdash-licenses -Ddash.summary=DEPENDENCIES -Ddash.fail=true; do
                      if [ "$attempt" -ge "$max_attempts" ]; then
                          echo "License check failed after $max_attempts attempts."
                          exit 1
                      fi
                      echo "License check attempt $attempt failed (possible transient Eclipse/ClearlyDefined API timeout). Retrying in 30s..."
                      attempt=$((attempt + 1))
                      sleep 30
                  done

            - name: Upload DEPENDENCIES
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: DEPENDENCIES
                  path: DEPENDENCIES
