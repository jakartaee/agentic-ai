name: Deploy site

# index.html is assembled at deploy time by build-site.py, which wraps content.html
# in the jakarta.ee chrome. Building here rather than by hand means an edit to
# content.html always reaches the published homepage; when the file was generated
# locally and committed, an edit that skipped the regeneration step silently never
# shipped.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deployment finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build against the live jakarta.ee page so the chrome tracks their design
      # without anyone remembering to re-save it. Fetch to RUNNER_TEMP so the
      # download is never itself published.
      #
      # Fail rather than falling back to a stale copy. A failed deploy is not an
      # outage -- deploy-pages only replaces the live site on success, so the last
      # good deployment keeps serving and this costs a re-run. Falling back would
      # instead publish silently stale chrome behind a green tick, and would hide
      # the one event worth acting on: a slice failure means jakarta.ee restructured
      # and the patterns below no longer match.
      - name: Assemble index.html from the jakarta.ee shell
        run: |
          set -euo pipefail
          shell="$RUNNER_TEMP/live-shell.html"

          if ! curl -fsSL --max-time 30 --retry 3 --retry-delay 5 \
                 https://jakarta.ee/specifications/agentic-ai/1.0/ -o "$shell"; then
            echo "::error title=Could not fetch the jakarta.ee shell::jakarta.ee did not respond after 3 attempts. The published site is unchanged; re-run this workflow once jakarta.ee is reachable."
            exit 1
          fi

          if ! python3 build-site.py "$shell" index.html content.html; then
            echo "::error title=Could not slice the jakarta.ee shell::build-site.py could not locate the header or footer in the fetched page, so jakarta.ee has restructured its markup. The published site is unchanged. Update the slice patterns in build-site.py, checking that Google Tag Manager still falls outside both slices."
            exit 1
          fi

      - uses: actions/configure-pages@v6

      # .git, .github and (since v4) dotfiles are excluded by the action, so the
      # artifact is index.html, content.html, build-site.py, assets/ and tutorial/.
      # A workflow deployment serves that verbatim without running Jekyll.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
