<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Content Studio</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0 auto; padding: 24px 16px; max-width: 860px; color: #222; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  h3 { font-size: 15px; margin: 16px 0 4px; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
  textarea { min-height: 140px; }
  button { margin: 10px 8px 0 0; padding: 8px 14px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin-top: 8px; color: #555; min-height: 1.5em; }
  .panel { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
  .q { margin: 10px 0; }
  .q ul { margin: 4px 0 0 20px; padding: 0; }
  .correct { font-weight: 600; }
  .exp { color: #555; font-size: 14px; }
  .notice { color: #a04000; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>Course Content Studio</h1>

<section>
  <label for="subject">Subject</label>
  <select id="subject">
    <option>Mathematics</option>
    <option>Physics</option>
    <option>English</option>
  </select>
  <label for="title">Chapter title</label>
  <input id="title" placeholder="Newton's Second Law">
  <label for="body">Chapter text</label>
  <textarea id="body" placeholder="Paste a few paragraphs of the chapter…"></textarea>
  <button id="generate">Generate packet</button>
  <div class="status" id="generateStatus"></div>
</section>

<section class="panel" id="packet" hidden>
  <h2>Packet</h2>
  <p class="notice" id="notice" hidden></p>
  <h3>Introduction</h3><p id="intro"></p>
  <h3>Quiz</h3><div id="quiz"></div>
  <h3>Conclusion</h3><p id="conclusion"></p>

  <h2>Refine</h2>
  <label for="section">Section</label>
  <select id="section">
    <option value="INTRO">Introduction</option>
    <option value="QUIZ">Quiz</option>
    <option value="CONCLUSION">Conclusion</option>
  </select>
  <label for="instruction">Instruction</label>
  <input id="instruction" placeholder="make the questions harder">
  <button id="refine">Refine</button>
  <button id="approve">Approve &amp; publish</button>
  <div class="status" id="packetStatus"></div>
</section>

<section class="panel" id="lesson" hidden>
  <h2>Published lesson</h2>
  <h3>What you'll learn</h3><ul id="objectives"></ul>
  <h3>Introduction</h3><p id="lessonIntro"></p>
  <h3>Quiz</h3><div id="lessonQuiz"></div>
  <h3>Conclusion</h3><p id="lessonConclusion"></p>
</section>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

async function post(url, body, statusEl, btn) {
  btn.disabled = true;
  statusEl.textContent = 'Working…';
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: body ? JSON.stringify(body) : null
    });
    const data = await res.json();
    statusEl.textContent = res.ok ? '' : (data.message || 'Error ' + res.status);
    return res.ok ? data : null;
  } catch (e) {
    statusEl.textContent = 'Request failed: ' + e;
    return null;
  } finally {
    btn.disabled = false;
  }
}

function renderQuiz(el, quiz) {
  const questions = (quiz && quiz.questions) || [];
  el.innerHTML = questions.map((q, i) => `<div class="q">${i + 1}. ${esc(q.prompt)}<ul>${
    (q.options || []).map((o, j) => `<li class="${j === q.correctIndex ? 'correct' : ''}">${esc(o)}</li>`).join('')
  }</ul><div class="exp">${esc(q.explanation)}</div></div>`).join('') || '<p class="exp">No questions.</p>';
}

function renderPacket(p) {
  $('packet').hidden = false;
  $('notice').hidden = !p.notice;
  $('notice').textContent = p.notice || '';
  $('intro').textContent = p.intro || '';
  renderQuiz($('quiz'), p.quiz);
  $('conclusion').textContent = p.conclusion || '';
}

function renderLesson(l) {
  $('lesson').hidden = false;
  $('objectives').innerHTML = (l.objectives || []).map(o => `<li>${esc(o)}</li>`).join('');
  $('lessonIntro').textContent = l.intro || '';
  renderQuiz($('lessonQuiz'), l.quiz);
  $('lessonConclusion').textContent = l.conclusion || '';
}

$('generate').onclick = async () => {
  const packet = await post('api/packet/generate',
    {subject: $('subject').value, chapterTitle: $('title').value, chapterBody: $('body').value},
    $('generateStatus'), $('generate'));
  if (packet) renderPacket(packet);
};

$('refine').onclick = async () => {
  const packet = await post('api/packet/refine-section',
    {section: $('section').value, instruction: $('instruction').value},
    $('packetStatus'), $('refine'));
  if (packet) {
    renderPacket(packet);
    $('instruction').value = '';
  }
};

$('approve').onclick = async () => {
  const lesson = await post('api/packet/approve', null, $('packetStatus'), $('approve'));
  if (lesson) {
    $('packetStatus').textContent = 'Published.';
    renderLesson(lesson);
  }
};

fetch('api/packet').then(r => r.ok ? r.json() : null).then(p => { if (p) renderPacket(p); });
fetch('api/lesson').then(r => r.ok ? r.json() : null).then(l => { if (l) renderLesson(l); });
</script>
</body>
</html>
