# LLM backend keys for the Payara Jakarta Agentic AI runtime.
# "vertex" uses Claude on Google Cloud Vertex AI authenticated via ADC (gcloud).
# Project ID and region fall back to the ANTHROPIC_VERTEX_PROJECT_ID and
# CLOUD_ML_REGION environment variables when the properties below are absent.
payara.agentic.llm.provider=vertex
payara.agentic.llm.model=claude-sonnet-4-6
payara.agentic.llm.max-tokens=4096
# System prompt (also used as the Anthropic prompt-cache prefix):
payara.agentic.llm.system=You are a writing assistant inside a customer contact form. You help the customer phrase a clear, concise, professional inquiry; classify it into one of a short list of categories; and extract identity details (name, business email, company) from text that already contains them. Follow the user instructions in each prompt exactly, keep the customer's voice and intent, and when asked for a specific output shape (plain text or JSON) return that shape with no commentary or framing.
