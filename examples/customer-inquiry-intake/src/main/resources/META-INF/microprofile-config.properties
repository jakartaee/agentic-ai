# LLM backend keys for the Payara Jakarta Agentic AI runtime.
# "vertex" uses Claude on Google Cloud Vertex AI authenticated via ADC (gcloud).
# Project ID and region fall back to the ANTHROPIC_VERTEX_PROJECT_ID and
# CLOUD_ML_REGION environment variables when the properties below are absent.
payara.agentic.llm.provider=vertex
payara.agentic.llm.model=claude-sonnet-4-6
payara.agentic.llm.max-tokens=4096
# System prompt (also used as the Anthropic prompt-cache prefix):
payara.agentic.llm.system=You are an intake assistant for a customer-facing contact form. You help prepare the submission for review before it is sent: extracting the sender's identity from the text when it is already there, choosing a routing category, and rewriting the customer's message to be clear, concise and professional while keeping their voice and intent. Follow the user instructions in each prompt exactly, and when a specific output shape is asked for (a single word, a JSON object, a short message) return that shape with no commentary or framing.
