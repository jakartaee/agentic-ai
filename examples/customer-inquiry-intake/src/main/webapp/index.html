<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Customer inquiry intake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --navy:   #0a1628;
            --blue:   #0055cc;
            --blue-h: #0044aa;
            --bg:     #f0f4f8;
            --card:   #ffffff;
            --border: #dde3ed;
            --ink:    #1a2535;
            --muted:  #64748b;
            --ok:     #15803d;
            --ease:   cubic-bezier(.4, 0, .2, 1);
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }

        header {
            background: var(--navy);
            padding: 0 32px;
            display: flex; align-items: center; gap: 24px;
            height: 64px;
        }
        .logo { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -.3px; }
        .logo span { color: #3d9bff; }
        .header-sub { color: #8fa8c8; font-size: 13px; padding-left: 24px; border-left: 1px solid #1e3256; }

        .page-grid {
            display: flex;
            gap: 20px;
            padding: 28px 32px;
            align-items: start;
        }

        .form-col {
            flex: 1; min-width: 0;
            max-width: 620px;
            margin: 0 auto;
            display: flex; flex-direction: column; gap: 20px;
            transition: max-width .36s var(--ease), margin .36s var(--ease);
        }
        .page-grid.panel-open .form-col { max-width: none; margin: 0; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 4px rgba(10,22,40,.06);
        }
        .card h2 { margin: 0 0 16px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

        /* Brief card */
        .brief-input {
            width: 100%; min-height: 110px; padding: 11px 14px;
            background: #fff; color: var(--ink);
            border: 1.5px solid var(--border); border-radius: 10px;
            font-size: 14px; font-family: inherit; line-height: 1.55;
            outline: none; resize: vertical;
            transition: border-color .15s, box-shadow .15s;
        }
        .brief-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,85,204,.1); }
        .brief-input::placeholder { color: var(--muted); }

        .actions { margin-top: 16px; display: flex; gap: 10px; align-items: center; }
        button {
            background: var(--blue); color: #fff; border: 0;
            padding: 10px 22px; border-radius: 24px;
            font-size: 14px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: background .15s;
        }
        button:hover:not(:disabled) { background: var(--blue-h); }
        button:disabled { opacity: .45; cursor: default; }
        button.ghost { background: transparent; color: var(--blue); border: 1px solid var(--border); }
        button.ghost:hover:not(:disabled) { background: var(--bg); }
        .status { color: var(--muted); font-size: 13px; }

        /* Structured fields */
        .inquiry-card { opacity: .55; transition: opacity .3s; }
        .inquiry-card.ready { opacity: 1; }
        .field-row {
            margin-top: 14px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #f8fafc;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }
        .field-row:first-of-type { margin-top: 0; }
        .field-row:hover { border-color: #c6d0e0; background: #f1f5fb; }
        .field-row.selected { border-color: var(--blue); background: #eaf1fb; }
        .field-row .label {
            font-size: 11px; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px;
        }
        .field-row .value {
            font-size: 14px; color: var(--ink); line-height: 1.5;
            white-space: pre-wrap; word-break: break-word; min-height: 1em;
        }
        .field-row .value.empty { color: var(--muted); font-style: italic; }
        .field-row .pill {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            background: var(--navy); color: #fff; font-size: 12px; font-weight: 500;
        }

        .submit-row {
            margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; align-items: center;
        }

        /* ── Side panel for per-field refinement ── */
        .guide-panel {
            flex-shrink: 0;
            width: 0; overflow: hidden;
            transition: width .36s var(--ease);
        }
        .guide-panel.open { width: 400px; }

        .guide-panel-inner {
            width: 400px;
            display: flex; flex-direction: column;
            border-radius: 12px;
            height: calc(100vh - 112px);
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 1px 4px rgba(10,22,40,.06);
            transform: translateX(20px); opacity: 0;
            transition: transform .36s var(--ease), opacity .28s var(--ease);
        }
        .guide-panel.open .guide-panel-inner { transform: translateX(0); opacity: 1; }

        .panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 20px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0; gap: 10px;
        }
        .panel-field-name {
            font-size: 13px; font-weight: 600; color: var(--ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1;
        }
        .panel-close {
            background: transparent; border: 1px solid var(--border);
            color: var(--muted); border-radius: 6px; width: 26px; height: 26px; padding: 0;
            cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
            font-family: inherit; flex-shrink: 0;
        }
        .panel-close:hover { background: var(--bg); color: var(--ink); }

        .panel-body {
            flex: 1; overflow-y: auto; padding: 20px;
            scrollbar-width: thin; scrollbar-color: var(--border) transparent;
        }
        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .current-value {
            font-size: 13.5px; color: var(--ink); line-height: 1.7;
            padding: 14px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--blue);
            white-space: pre-wrap;
        }
        .current-value.hint { color: var(--muted); font-style: italic; border-left-color: var(--border); }
        .current-value-label {
            font-size: 10px; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;
        }

        .panel-divider { height: 1px; background: var(--border); margin: 0; flex-shrink: 0; }

        .panel-chat { padding: 14px 20px 18px; display: flex; flex-direction: column; gap: 9px; flex-shrink: 0; }
        .panel-chat-label { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
        .chatlog { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }
        .msg { font-size: 13px; padding: 7px 11px; border-radius: 14px; max-width: 85%; line-height: 1.5; }
        .msg.you { background: var(--blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
        .msg.agent { background: var(--bg); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 3px; border: 1px solid var(--border); }
        .chatbar { display: flex; gap: 7px; }
        .chatbar input {
            flex: 1; padding: 8px 12px;
            background: #fff; color: var(--ink);
            border: 1.5px solid var(--border); border-radius: 18px;
            font-size: 13px; font-family: inherit; outline: none;
        }
        .chatbar input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,85,204,.1); }
        .chatbar input::placeholder { color: var(--muted); }
        .chatbar button { border-radius: 18px; padding: 8px 16px; font-size: 13px; }

        .toast {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: #1a2535; color: #fff;
            padding: 10px 20px; border-radius: 24px;
            font-size: 13px; font-weight: 500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            opacity: 0; pointer-events: none; z-index: 1000;
            transition: opacity .22s, transform .22s;
            white-space: nowrap;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header>
    <div class="logo">Intake<span>·</span>Agent</div>
    <p class="header-sub">Customer inquiry intake &mdash; triaged with Jakarta Agentic AI</p>
</header>

<div class="toast" id="toast"></div>

<div class="page-grid" id="pageGrid">

    <div class="form-col">
        <div class="card">
            <h2>Customer's message</h2>
            <textarea id="brief" class="brief-input" placeholder="Paste the raw inquiry here — email body, chat message, voicemail transcript, whatever came in…"></textarea>
            <div class="actions">
                <button id="draftBtn" onclick="draft()">Draft structured inquiry</button>
                <span class="status" id="status"></span>
            </div>
        </div>

        <div class="card inquiry-card" id="inquiryCard">
            <h2>Triaged inquiry</h2>
            <div id="inquiryFields">
                <div class="field-row">
                    <div class="value hint">Draft an inquiry above to see the triaged record here.</div>
                </div>
            </div>
            <div class="submit-row">
                <button id="submitBtn" onclick="submitInquiry()" disabled>Submit</button>
            </div>
        </div>
    </div>

    <div class="guide-panel" id="guidePanel">
        <div class="guide-panel-inner">

            <div class="panel-header">
                <span class="panel-field-name" id="panelFieldName">—</span>
                <button class="panel-close" onclick="closePanel()" aria-label="Close">✕</button>
            </div>

            <div class="panel-body">
                <div class="current-value-label">Current value</div>
                <div class="current-value hint" id="currentValue">Pick a field to refine.</div>
            </div>

            <div class="panel-divider"></div>

            <div class="panel-chat">
                <div class="panel-chat-label">Refine this field</div>
                <div class="chatlog" id="chatlog"></div>
                <div class="chatbar">
                    <input id="chatInput" type="text" placeholder="e.g. shorter, more formal, drop the deadline…"/>
                    <button id="refineBtn" onclick="refine()">Send</button>
                </div>
            </div>

        </div>
    </div>

</div>

<script>
    const $ = (id) => document.getElementById(id);

    let schema       = null;   // FormSpec from /api/form
    let inquiry      = null;   // current structured inquiry (object), or null
    let selectedField = null;
    const chatHistory = {};

    async function loadSchema() {
        schema = await (await fetch('api/form')).json();
    }

    async function loadInquiry() {
        const res = await fetch('api/inquiry');
        if (res.status === 200) {
            inquiry = await res.json();
            renderInquiry();
        }
    }

    function renderInquiry() {
        const host = $('inquiryFields');
        host.innerHTML = '';
        if (!inquiry) {
            const row = document.createElement('div');
            row.className = 'field-row';
            row.innerHTML = '<div class="value hint">Draft an inquiry above to see the triaged record here.</div>';
            host.appendChild(row);
            $('submitBtn').disabled = true;
            $('inquiryCard').classList.remove('ready');
            return;
        }
        for (const f of schema.fields) {
            const value = inquiry[f.name] || '';
            const row = document.createElement('div');
            row.className = 'field-row';
            row.dataset.name = f.name;
            if (selectedField && selectedField.name === f.name) row.classList.add('selected');

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = f.label;
            row.appendChild(label);

            const val = document.createElement('div');
            val.className = 'value';
            if (!value) {
                val.classList.add('empty');
                val.textContent = '—';
            } else if (f.type === 'select') {
                const pill = document.createElement('span');
                pill.className = 'pill';
                pill.textContent = value;
                val.appendChild(pill);
            } else {
                val.textContent = value;
            }
            row.appendChild(val);

            row.addEventListener('click', () => selectField(f));
            host.appendChild(row);
        }
        $('submitBtn').disabled = false;
        $('inquiryCard').classList.add('ready');
    }

    function selectField(field) {
        selectedField = field;
        document.querySelectorAll('.field-row').forEach(r => r.classList.remove('selected'));
        const row = document.querySelector(`.field-row[data-name="${field.name}"]`);
        if (row) row.classList.add('selected');

        $('panelFieldName').textContent = field.label;
        const vEl = $('currentValue');
        const current = inquiry && inquiry[field.name];
        if (current) {
            vEl.textContent = current;
            vEl.classList.remove('hint');
        } else {
            vEl.textContent = '(empty)';
            vEl.classList.add('hint');
        }
        $('chatlog').innerHTML = '';
        (chatHistory[field.name] || []).forEach(m => appendMsg(m.cls, m.text));

        $('guidePanel').classList.add('open');
        $('pageGrid').classList.add('panel-open');
    }

    function closePanel() {
        $('guidePanel').classList.remove('open');
        $('pageGrid').classList.remove('panel-open');
        document.querySelectorAll('.field-row').forEach(r => r.classList.remove('selected'));
        selectedField = null;
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

    function busy(on, msg) {
        $('draftBtn').disabled = on;
        $('refineBtn').disabled = on;
        $('submitBtn').disabled = on || !inquiry;
        $('status').textContent = on ? (msg || '') : '';
    }

    function showToast(msg, duration = 3500) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), duration);
    }

    async function draft() {
        const brief = $('brief').value.trim();
        if (!brief) {
            $('status').textContent = 'Paste a customer message first.';
            return;
        }
        busy(true, 'Triaging…');
        try {
            const res = await fetch('api/inquiry/draft', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ brief })
            });
            if (!res.ok) {
                $('status').textContent = (await res.text()) || 'Something went wrong.';
                return;
            }
            inquiry = await res.json();
            renderInquiry();
            showToast('✓ Triaged — click any row to refine');
        } catch (e) {
            $('status').textContent = 'Error: ' + e;
        } finally {
            busy(false);
        }
    }

    function appendMsg(cls, text) {
        const m = document.createElement('div');
        m.className = 'msg ' + cls; m.textContent = text;
        $('chatlog').appendChild(m);
        $('chatlog').scrollTop = $('chatlog').scrollHeight;
    }

    function addMsg(cls, text) {
        if (!selectedField) return;
        if (!chatHistory[selectedField.name]) chatHistory[selectedField.name] = [];
        chatHistory[selectedField.name].push({ cls, text });
        appendMsg(cls, text);
    }

    async function refine() {
        if (!selectedField) return;
        const instruction = $('chatInput').value.trim();
        if (!instruction) return;

        addMsg('you', instruction);
        $('chatInput').value = '';
        busy(true, 'Refining…');
        try {
            const res = await fetch('api/inquiry/refine-field', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fieldName: selectedField.name, instruction })
            });
            if (!res.ok) {
                addMsg('agent', (await res.text()) || 'Something went wrong.');
                return;
            }
            inquiry = await res.json();
            renderInquiry();
            // selectField cleared the chatlog; put history back and acknowledge
            const sel = selectedField;
            selectedField = null;
            selectField(sel);
            addMsg('agent', 'Updated.');
        } catch (e) {
            addMsg('agent', 'Error: ' + e);
        } finally {
            busy(false);
        }
    }

    async function submitInquiry() {
        if (!inquiry) return;
        busy(true, 'Submitting…');
        try {
            const res = await fetch('api/inquiry/submit', { method: 'POST' });
            if (!res.ok) {
                $('status').textContent = (await res.text()) || 'Submit failed.';
                return;
            }
            showToast('✓ Inquiry handed off — a teammate will pick it up');
        } catch (e) {
            $('status').textContent = 'Error: ' + e;
        } finally {
            busy(false);
        }
    }

    $('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') refine(); });

    async function init() {
        await loadSchema();
        await loadInquiry();
    }
    init();
</script>
</body>
</html>
