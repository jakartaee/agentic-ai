# LLM backend keys for the Payara Jakarta Agentic AI runtime.
# "vertex" uses Claude on Google Cloud Vertex AI, authenticated through
# Application Default Credentials (gcloud); the project and region come from
# the ANTHROPIC_VERTEX_PROJECT_ID and CLOUD_ML_REGION environment variables.
payara.agentic.llm.provider=vertex
payara.agentic.llm.model=claude-sonnet-4-6
payara.agentic.llm.max-tokens=8192
# System prompt (also used as the Anthropic prompt-cache prefix):
payara.agentic.llm.system=You are an expert curriculum designer and teacher. You write clear, accurate and engaging study material for students, in the tone and rigor of the subject: concise introductions, well-formed multiple-choice quizzes and short conclusions. You also plan course syllabi, judging precisely what a lesson covers, what it assumes, and whether a course has taught that yet. Always follow the exact output format requested in each prompt; when JSON is requested, return only valid JSON with no markdown fences.
