# LLM backend keys for Payara Server Community, the first implementation of
# Jakarta Agentic AI. These keys are Payara-specific: the specification does not
# standardize provider configuration yet.
# This example uses a small local model via Ollama (no API key, no cost).
payara.agentic.llm.provider=ollama
payara.agentic.llm.model=gemma3:4b
payara.agentic.llm.ollama.base-url=http://localhost:11434
